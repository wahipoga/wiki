<!DOCTYPE html>
<html lang="pt-BR" id="lang-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki Laços Profanos</title>
    <link rel="icon" href="https://i.imgur.com/mgxXSto.png" type="image/png">

    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://i.imgur.com">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<nav class="navbar" id="navbar">
    <div class="nav-container">
        <a href="/" class="logo">Laços Profanos</a>

        <div class="nav-busca">
            <i class="fas fa-search"></i>
            <input type="search" id="navBusca" placeholder="Buscar..." autocomplete="off">
        </div>

        <div class="language-dropdown" id="languageDropdown">
            <button class="language-btn" id="languageBtn">
                <i class="fas fa-globe"></i>
                <span id="current-language">Português</span>
                <i class="fas fa-chevron-down"></i>
            </button>
            <div class="dropdown-content" id="dropdownContent"></div>
        </div>

        <ul class="nav-menu" id="navMenu"></ul>

        <button class="hamburger" id="hamburger" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
    </div>
</nav>

<main class="container">
    <h1 class="page-title">Wiki Laços Profanos</h1>
    <p class="page-subtitle">Enciclopédia colaborativa do universo criado por Eduarda Victoria.</p>

    <div class="categorias-grid" id="categoriasGrid">
        <p class="vazio">Carregando categorias...</p>
    </div>
</main>

<footer>
    <p>Wiki Laços Profanos — projeto de fãs. <a href="/contribua.html">Contribua</a></p>
</footer>

<script src="/assets/app.js"></script>
<script>
    // Carrega as categorias e monta os cards
    fetch('/categorias.json?v=' + Date.now())
        .then(r => r.json())
        .then(cats => {
            const grid = document.getElementById('categoriasGrid');
            if (!cats.length) {
                grid.innerHTML = '<p class="vazio">Nenhuma categoria ainda.</p>';
                return;
            }
            grid.innerHTML = cats.map(c => `
                <a class="categoria-card" href="/${c.slug}/">
                    <img src="${c.imagem}" alt="${c.nome}" loading="lazy" onerror="this.src='https://placehold.co/600x340/1a1a1a/666?text=${encodeURIComponent(c.nome)}'">
                    <div class="info">
                        <h2>${c.nome}</h2>
                        <p>${c.descricao || ''}</p>
                    </div>
                </a>
            `).join('');
        })
        .catch(err => {
            document.getElementById('categoriasGrid').innerHTML =
                `<p class="vazio">Erro ao carregar categorias: ${err.message}</p>`;
        });
</script>

</body>
</html>
